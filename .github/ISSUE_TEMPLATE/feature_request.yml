name: Feature request
description: Explain an SMP problem and the player benefit of an improvement.
title: "[Feature] "
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Requests are public suggestions, not implementation promises. Do not post private server
        information, credentials or player data. Security reports belong in the private channel in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem being solved
      description: Describe the current difficulty before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
    validations:
      required: true
  - type: textarea
    id: smp_use_case
    attributes:
      label: Relevant SMP use case
      description: Give an anonymous example from a survival multiplayer community.
    validations:
      required: true
  - type: textarea
    id: player_benefit
    attributes:
      label: Expected player benefit
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-report safety
      options:
        - label: I checked existing requests and included no private or sensitive information.
          required: true
